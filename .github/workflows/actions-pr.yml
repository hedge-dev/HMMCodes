name: Check codes

on: [ pull_request, workflow_dispatch ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up dotnet
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x

    - name: Run test
      run: |
        dotnet run build.cs test
